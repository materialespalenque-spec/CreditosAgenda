name: Compilar APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'package.json', 'capacitor.config.json', 'scripts/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar web y proyecto Android
        run: |
          node scripts/preparar-app.js
          npx cap add android
          npx cap sync android

      - name: Llave de firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AgendaCreditos.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest AgendaCreditos.apk \
            --title "Agenda de Créditos (última versión)" \
            --notes "Compilada automáticamente el $(date -u +'%Y-%m-%d %H:%M') UTC desde el commit ${GITHUB_SHA::7}."
